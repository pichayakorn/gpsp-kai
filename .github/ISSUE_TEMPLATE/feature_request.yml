name: Feature request
description: An idea for kai
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What should kai do, and when would you use it?
    validations:
      required: true
  - type: textarea
    id: now
    attributes:
      label: What you do today
      description: How you work around it now, if at all
