# Builds gpSP kai on every push and pull request, checks the message files
# and offers the ready-to-copy PSP folder as a downloadable artifact.
# The release workflow also calls it to attach the zip to a GitHub release.
name: Build

on:
  push:
    branches: [main]   # other branches are built through their pull request
  pull_request:
    # The release-please PR only changes these files, and its code has already
    # been built on main. Ignoring them means no run is started for it at all
    # (a job-level "if" would still wait for approval, as the PR is a bot's).
    paths-ignore:
      - version.txt
      - CHANGELOG.md
      - .release-please-manifest.json
  workflow_call:
    inputs:
      release-tag:
        description: Tag of the GitHub release to attach the zip to
        type: string
        default: ''

permissions:
  contents: write   # only used to attach the zip to a release

jobs:
  build:
    runs-on: ubuntu-latest
    # A fixed toolchain, so a release is built with the compiler that was
    # tested. To update it, pick a newer monthly tag of pspdev/pspdev, check
    # that the build has no new warnings, and test the result on a PSP.
    container: pspdev/pspdev:v20261101
    env:
      CFW_SDK_COMMIT: d871f3f57a718cfdc0a0687da608f787b1445ad7
    steps:
      # tar and zstd: actions/cache runs GNU tar options (--posix) that the
      # image's BusyBox tar rejects, so without them the cache never saves.
      - name: Install build tools
        run: apk add --no-cache zip python3 curl tar zstd

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # tags are needed to tell release builds from dev builds
          ref: ${{ inputs.release-tag || github.ref }}

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # kai links only two psp-cfw-sdk stub libraries. They are built from a
      # fixed upstream commit (upstream only publishes a "latest" zip that
      # changes on every push) and cached, so the build runs once per commit.
      # To update: set a newer commit, check the build, test on a PSP.
      - name: Cache psp-cfw-sdk (kubridge, systemctrl)
        id: cfw-sdk
        uses: actions/cache@v6
        with:
          path: /tmp/psp-cfw-sdk
          key: psp-cfw-sdk-${{ env.CFW_SDK_COMMIT }}-pspdev-v20261101

      - name: Build psp-cfw-sdk (kubridge, systemctrl)
        if: steps.cfw-sdk.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/cfw-src /tmp/psp-cfw-sdk/lib
          curl -fsSL "https://codeload.github.com/pspdev/psp-cfw-sdk/tar.gz/$CFW_SDK_COMMIT" \
            | tar xz -C /tmp/cfw-src --strip-components=1
          make -C /tmp/cfw-src/src/KUBridge
          make -C /tmp/cfw-src/src/SystemCtrlForUser
          cp /tmp/cfw-src/src/KUBridge/libpspkubridge.a \
             /tmp/cfw-src/src/SystemCtrlForUser/libpspsystemctrl_user.a /tmp/psp-cfw-sdk/lib/
          cp -r /tmp/cfw-src/include /tmp/psp-cfw-sdk/include
          # systemctrl_adrenaline.h is a symlink in the image; keep it.
          rm -f /tmp/psp-cfw-sdk/include/systemctrl_adrenaline.h

      - name: Install psp-cfw-sdk (kubridge, systemctrl)
        run: cp -r /tmp/psp-cfw-sdk/lib /tmp/psp-cfw-sdk/include /usr/local/pspdev/psp/sdk/

      - name: Check messages, build and package
        id: build
        run: |
          make -j"$(nproc)" release
          echo "version=$(make -s version)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: gpSP-kai-${{ steps.build.outputs.version }}
          path: out/gpSP-kai

      - name: Attach the zip to the release
        if: inputs.release-tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release-tag }}
          files: out/gpSP-kai-*.zip
